
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff4f8">
<title>Silver Love | Joias de Prata</title>

<style>
:root {
  --rosa:#b72c68;
  --rosa-claro:#fff2f7;
  --rosa-medio:#f3d6e2;
  --prata:#a0a0a9;
  --texto:#47343f;
  --branco:#ffffff;
}
* {box-sizing:border-box}
html {scroll-behavior:smooth}
body {
  margin:0;
  background:var(--rosa-claro);
  color:var(--texto);
  font-family:Arial,Helvetica,sans-serif;
}
button,a { -webkit-tap-highlight-color:transparent }
button {font:inherit;cursor:pointer}
[hidden] {display:none!important}

/* CAPA INICIAL */
.capa {
  min-height:100vh;
  min-height:100dvh;
  max-width:600px;
  margin:auto;
  padding:22px 18px 36px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:22px;
  text-align:center;
  background:linear-gradient(
    160deg,#fffafd,#ffe9f2,#fff8fb
  );
}
.capa-imagem {
  width:100%;
  max-width:520px;
  max-height:75vh;
  object-fit:contain;
  border-radius:18px;
}
.capa-texto {
  margin:0;
  color:#8d6175;
  font:italic 20px Georgia,serif;
}
.botao {
  display:inline-block;
  width:100%;
  padding:16px 20px;
  border:0;
  border-radius:30px;
  background:linear-gradient(120deg,#ad235e,#d14a84);
  color:white;
  font-weight:bold;
  text-decoration:none;
  text-align:center;
  box-shadow:0 5px 14px #b72c6829;
}
.botao:active {transform:scale(.98)}
.botao-capa {max-width:350px}

/* CATÁLOGO */
.topo {
  padding:20px 18px 23px;
  text-align:center;
  background:linear-gradient(180deg,#fff,#fff4f8);
  border-bottom:1px solid var(--rosa-medio);
}
.voltar {
  display:block;
  margin:0 0 14px;
  padding:9px;
  border:0;
  background:transparent;
  color:var(--rosa);
  font-size:15px;
}
.marca {
  max-width:320px;
  margin:0 auto;
  padding:12px;
  border-radius:18px;
  background:#fff;
  box-shadow:0 3px 20px #b72c6812;
}
.marca img {
  display:block;
  width:100%;
  max-height:240px;
  object-fit:contain;
}
.topo-descricao {
  margin:16px 0 0;
  color:#946b7f;
  font:italic 18px Georgia,serif;
}
.conteudo {
  max-width:1050px;
  margin:auto;
  padding:25px 14px 45px;
}
.titulo {
  margin:0 0 8px;
  text-align:center;
  font:normal 33px Georgia,serif;
  color:var(--rosa);
}
.subtitulo {
  margin:0 0 22px;
  text-align:center;
  font-size:14px;
  color:#8e7180;
}
.filtros {
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:0 0 20px;
  scrollbar-width:thin;
}
.filtros button {
  flex-shrink:0;
  padding:11px 16px;
  border:1px solid #edcbd9;
  border-radius:25px;
  background:white;
  color:#795365;
}
.filtros button.ativo {
  background:var(--rosa);
  border-color:var(--rosa);
  color:white;
}
.grade {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}
.produto {
  min-width:0;
  overflow:hidden;
  border:1px solid #f2dce5;
  border-radius:16px;
  background:white;
  box-shadow:0 4px 18px #9b577013;
}
.foto {
  width:100%;
  aspect-ratio:4/5;
  object-fit:cover;
  display:block;
  background:#faf1f5;
}
.info {padding:13px}
.nome {
  min-height:47px;
  margin:0 0 8px;
  font:normal 20px/1.15 Georgia,serif;
}
.codigo {
  margin:0 0 9px;
  font-size:12px;
  color:#8d8188;
}
.descricao {
  font-size:13px;
  line-height:1.5;
  color:#74616b;
}
.preco {
  margin:13px 0;
  font-size:21px;
  font-weight:bold;
  color:var(--rosa);
}
.botao-produto {
  padding:13px 8px;
  font-size:12px;
  border-radius:11px;
}
.rodape {
  padding:28px 18px 38px;
  text-align:center;
  background:white;
  border-top:1px solid var(--rosa-medio);
}
.rodape h2 {
  margin:0 0 10px;
  font:normal 26px Georgia,serif;
  color:var(--rosa);
}
.rodape p {
  color:#856a78;
  font-size:14px;
}
.rodape .botao {
  max-width:330px;
  margin-top:10px;
}
@media(min-width:650px){
  .grade {grid-template-columns:repeat(3,1fr)}
  .info {padding:18px}
  .nome {font-size:23px}
  .botao-produto {font-size:14px}
}
@media(max-width:360px){
  .grade {gap:9px}
  .info {padding:10px}
  .nome {font-size:17px}
  .preco {font-size:18px}
}
</style>
</head>

<body>

<!-- CAPA ORIGINAL DA SILVER LOVE -->
<section id="capa" class="capa">
  <img
    class="capa-imagem"
    src="file_000000005dd0820ea2f6d578fafcb67e.png"
    alt="Silver Love - Joias de Prata"
  >
  <p class="capa-texto">
    Uma joia especial para cada história.
  </p>
  <button
    class="botao botao-capa"
    onclick="abrirCatalogo()"
  >
    Conhecer nossas joias
  </button>
</section>

<!-- CATÁLOGO -->
<div id="loja" hidden>

<header class="topo">
  <button class="voltar" onclick="voltarCapa()">
    ← Voltar à capa
  </button>

  <div class="marca">
    <img
      src="file_000000005dd0820ea2f6d578fafcb67e.png"
      alt="Silver Love - Joias de Prata"
    >
  </div>

  <p class="topo-descricao">
    Elegância e delicadeza em cada detalhe.
  </p>
</header>

<main class="conteudo">
  <h1 class="titulo">Nossa coleção</h1>
  <p class="subtitulo">
    Escolha sua joia favorita e consulte pelo WhatsApp.
  </p>

  <nav id="filtros" class="filtros"
       aria-label="Categorias de joias"></nav>

  <section id="produtos" class="grade"
           aria-label="Produtos disponíveis"></section>
</main>

<footer class="rodape">
  <h2>Silver Love</h2>
  <p>Joias de prata para momentos especiais.</p>
  <a
    id="whatsappGeral"
    class="botao"
    target="_blank"
    rel="noopener noreferrer"
  >
    Falar pelo WhatsApp
  </a>
</footer>

</div>

<script>
const WHATSAPP = "5541984300046";

const produtos = [
  {
    codigo:"108413",
    categoria:"Brincos",
    nome:"Trio de brincos trevo",
    preco:112,
    descricao:"Conjunto com três pares de brincos em formato de trevo.",
    imagem:"fotos/108413.jpg"
  },
  {
    codigo:"SL2026-004",
    categoria:"Brincos",
    nome:"Brinco gota com zircônias",
    preco:105,
    descricao:"Brinco em formato de gota, com zircônias.",
    imagem:"fotos/SL2026-004.jpg"
  },
  {
    codigo:"SL2026-003",
    categoria:"Brincos",
    nome:"Brinco curvo com zircônias",
    preco:137,
    descricao:"Brinco curvo com detalhes em zircônias.",
    imagem:"fotos/SL2026-003.jpg"
  },
  {
    codigo:"SL2026-002",
    categoria:"Brincos",
    nome:"Brinco círculo com zircônias",
    preco:107,
    descricao:"Brinco circular com acabamento delicado.",
    imagem:"fotos/SL2026-002.jpg"
  },
  {
    codigo:"SL2026-001",
    categoria:"Brincos",
    nome:"Brinco pedra vermelha",
    preco:70,
    descricao:"Brinco de prata com pedra vermelha.",
    imagem:"fotos/SL2026-001.jpg"
  },
  {
    codigo:"143588",
    categoria:"Brincos",
    nome:"Argola trançada",
    preco:57,
    descricao:"Argola de prata com acabamento trançado.",
    imagem:"fotos/143588.jpg"
  },
  {
    codigo:"143332",
    categoria:"Brincos",
    nome:"Brinco quadrado de prata",
    preco:55,
    descricao:"Brinco de prata em formato quadrado.",
    imagem:"fotos/143332.jpg"
  },
  {
    codigo:"154458",
    categoria:"Anéis",
    nome:"Anel liso de prata",
    preco:90.20,
    descricao:"Anel de prata liso, tamanho 12.",
    imagem:"fotos/154458.jpg"
  },
  {
    codigo:"68071",
    categoria:"Pulseiras",
    nome:"Pulseira veneziana com bolinhas",
    preco:84,
    descricao:"Pulseira veneziana com bolinhas, 18 cm.",
    imagem:"fotos/68071.jpg"
  },
  {
    codigo:"94781",
    categoria:"Colares",
    nome:"Corrente quadrada de prata",
    preco:199,
    descricao:"Corrente quadrada de prata, 45 cm.",
    imagem:"fotos/94781.jpg"
  },
  {
    codigo:"SL2026-005",
    categoria:"Colares",
    nome:"Colar pingente redondo",
    preco:182.50,
    descricao:"Colar de prata com pingente redondo.",
    imagem:"fotos/SL2026-005.jpg"
  }
];

function formatarPreco(valor) {
  return Number(valor).toLocaleString("pt-BR", {
    style:"currency",
    currency:"BRL"
  });
}

function abrirCatalogo() {
  document.getElementById("capa").hidden = true;
  document.getElementById("loja").hidden = false;
  if (location.hash !== "#catalogo") {
    history.replaceState(null, "", "#catalogo");
  }
  window.scrollTo(0,0);
}

function voltarCapa() {
  document.getElementById("loja").hidden = true;
  document.getElementById("capa").hidden = false;
  history.replaceState(null, "", "#capa");
  window.scrollTo(0,0);
}

function linkWhatsApp(mensagem) {
  return "https://wa.me/" + WHATSAPP +
    "?text=" + encodeURIComponent(mensagem);
}

function criarProduto(produto) {
  const card = document.createElement("article");
  card.className = "produto";

  const foto = document.createElement("img");
  foto.className = "foto";
  foto.src = produto.imagem;
  foto.alt = produto.nome;
  foto.loading = "lazy";

  const info = document.createElement("div");
  info.className = "info";

  const nome = document.createElement("h2");
  nome.className = "nome";
  nome.textContent = produto.nome;

  const codigo = document.createElement("p");
  codigo.className = "codigo";
  codigo.textContent = "Código: " + produto.codigo;

  const descricao = document.createElement("p");
  descricao.className = "descricao";
  descricao.textContent = produto.descricao;

  const preco = document.createElement("p");
  preco.className = "preco";
  preco.textContent = formatarPreco(produto.preco);

  const botao = document.createElement("a");
  botao.className = "botao botao-produto";
  botao.target = "_blank";
  botao.rel = "noopener noreferrer";
  botao.textContent = "Consultar pelo WhatsApp";
  botao.href = linkWhatsApp(
    "Olá! Tenho interesse na joia " +
    produto.nome +
    " (código " + produto.codigo + ")" +
    ", no valor de " +
    formatarPreco(produto.preco) +
    ". Está disponível?"
  );

  info.append(
    nome,
    codigo,
    descricao,
    preco,
    botao
  );

  card.append(foto,info);
  return card;
}

function mostrarProdutos(categoria="Todas") {
  const grade = document.getElementById("produtos");
  grade.replaceChildren();

  const selecionados = produtos.filter(produto =>
    categoria === "Todas" ||
    produto.categoria === categoria
  );

  selecionados.forEach(produto => {
    grade.appendChild(criarProduto(produto));
  });

  document.querySelectorAll(".filtros button")
    .forEach(botao => {
      botao.classList.toggle(
        "ativo",
        botao.textContent === categoria
      );
    });
}

function criarFiltros() {
  const filtros = document.getElementById("filtros");
  const categorias = [
    "Todas",
    ...new Set(produtos.map(p => p.categoria))
  ];

  categorias.forEach(categoria => {
    const botao = document.createElement("button");
    botao.type = "button";
    botao.textContent = categoria;
    botao.onclick = () => mostrarProdutos(categoria);
    filtros.appendChild(botao);
  });
}

document.getElementById("whatsappGeral").href =
  linkWhatsApp(
    "Olá! Gostaria de conhecer as joias da Silver Love."
  );

criarFiltros();
mostrarProdutos();

if (location.hash === "#catalogo") {
  abrirCatalogo();
}
</script>

</body>
</html>
