
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silver Love | Joias de Prata</title>
<style>
:root {
  --rosa:#c32670;
  --claro:#fff5f9;
  --texto:#392b35;
}
* {box-sizing:border-box}
body {
  margin:0;
  font-family:Arial,sans-serif;
  color:var(--texto);
  background:var(--claro);
}
button,input,select {font:inherit}
button {cursor:pointer}
.capa {
  min-height:100vh;
  max-width:550px;
  margin:auto;
  padding:18px;
  background:white;
  text-align:center;
}
.capa img {
  width:100%;
  max-height:72vh;
  object-fit:contain;
}
.capa h1 {
  color:var(--rosa);
  font-family:Georgia,serif;
}
.btn {
  display:block;
  width:100%;
  padding:16px;
  border:0;
  border-radius:12px;
  background:var(--rosa);
  color:white;
  font-weight:bold;
  text-align:center;
  text-decoration:none;
}
header {
  background:white;
  text-align:center;
  padding:16px;
  border-bottom:1px solid #f2d6e2;
}
header img {
  max-width:180px;
  max-height:110px;
  object-fit:contain;
}
header h1 {
  font:normal 30px Georgia,serif;
  color:var(--rosa);
  margin:8px;
}
header p {margin:5px;color:#765c69}
main {
  max-width:1000px;
  margin:auto;
  padding:20px 14px;
}
.filtros {
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:10px 0 20px;
}
.filtros button {
  flex-shrink:0;
  padding:10px 15px;
  border:1px solid #eac9d8;
  border-radius:25px;
  background:white;
  color:var(--texto);
}
.filtros button.ativo {
  background:var(--rosa);
  color:white;
}
.grade {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}
.produto {
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 3px 12px #0000000d;
}
.produto img {
  width:100%;
  aspect-ratio:4/5;
  object-fit:cover;
  background:#f3e8ed;
}
.info {padding:12px}
.info h3 {
  font:normal 21px Georgia,serif;
  margin:0 0 8px;
}
.codigo {font-size:12px;color:#777}
.preco {
  color:var(--rosa);
  font-size:21px;
  font-weight:bold;
  margin:12px 0;
}
.info .btn {
  font-size:13px;
  padding:13px 5px;
}
footer {
  padding:30px 16px;
  text-align:center;
  color:#795d6b;
}
.voltar {
  border:0;
  background:transparent;
  color:var(--rosa);
  margin:10px;
  padding:10px;
}
[hidden] {display:none!important}
@media(min-width:650px){
  .grade {grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<section id="capa" class="capa">
  <img
    src="file_000000005dd0820ea2f6d578fafcb67e.png"
    alt="Silver Love - Amor puro em sua forma mais bela"
  >
  <h1>Silver Love</h1>
  <p>Joias de prata para momentos especiais.</p>
  <button class="btn" onclick="abrirCatalogo()">
    Conhecer nossas joias
  </button>
</section>

<div id="loja" hidden>
<header>
  <button class="voltar" onclick="voltarCapa()">
    ← Voltar à capa
  </button>
  <div>
    <img
      src="file_00000000a4e0820eaeac6b81eac7fe57.png"
      alt="Silver Love"
    >
  </div>
  <h1>Silver Love</h1>
  <p>Joias de prata</p>
  <p>Amor puro em sua forma mais bela</p>
</header>

<main>
  <h2>Nossas joias</h2>
  <div id="filtros" class="filtros"></div>
  <div id="produtos" class="grade"></div>
</main>

<footer>
  <p>Silver Love — Joias de Prata</p>
  <p>Escolha sua joia e consulte pelo WhatsApp.</p>
  <a class="btn" id="whatsappGeral"
     target="_blank" rel="noopener">
    Falar no WhatsApp
  </a>
</footer>
</div>

<script>
const WHATSAPP = "5541984300046";

const produtos = [
  {
    codigo:"108413",
    categoria:"Brincos",
    nome:"Trio de brincos trevo",
    preco:112,
    descricao:"Conjunto com três pares de brincos pequenos em formato de trevo, em tons prateado e dourado.",
    imagem:"fotos/108413.jpg"
  },
  {
    codigo:"SL2026-004",
    categoria:"Brincos",
    nome:"Brinco gota com zircônias",
    preco:105,
    descricao:"Par de brincos de prata em formato de gota, cravejados com zircônias.",
    imagem:"fotos/sl2026-004.jpg"
  },
  {
    codigo:"SL2026-003",
    categoria:"Brincos",
    nome:"Brinco curvo com zircônias",
    preco:137,
    descricao:"Brinco de prata em formato curvo, com zircônias em engaste individual.",
    imagem:"fotos/sl2026-003.jpg"
  },
  {
    codigo:"SL2026-002",
    categoria:"Brincos",
    nome:"Brinco círculo com zircônias",
    preco:107,
    descricao:"Par de brincos de prata em formato de círculo vazado, cravejado com zircônias.",
    imagem:"fotos/sl2026-002.jpg"
  },
  {
    codigo:"SL2026-001",
    categoria:"Brincos",
    nome:"Brinco pedra vermelha",
    preco:70,
    descricao:"Par de brincos de prata 925 com pedra vermelha redonda e engaste liso.",
    imagem:"fotos/sl2026-001.jpg"
  },
  {
    codigo:"143588",
    categoria:"Brincos",
    nome:"Argola trançada",
    preco:57,
    descricao:"Par de argolas de prata com acabamento trançado e fecho de encaixe.",
    imagem:"fotos/143588.jpg"
  },
  {
    codigo:"143332",
    categoria:"Brincos",
    nome:"Brinco quadrado de prata",
    preco:55,
    descricao:"Par de brincos de prata em formato quadrado vazado, fio 1,30.",
    imagem:"fotos/143332.jpg"
  },
  {
    codigo:"154458",
    categoria:"Anéis",
    nome:"Anel liso de prata",
    preco:90.20,
    descricao:"Anel de prata liso, tamanho 12.",
    imagem:"fotos/154458.jpg"
  },
  {
    codigo:"68071",
    categoria:"Pulseiras",
    nome:"Pulseira veneziana com bolinhas",
    preco:84,
    descricao:"Pulseira de prata veneziana com bolinhas, 18 cm.",
    imagem:"fotos/68071.jpg"
  },
  {
    codigo:"94781",
    categoria:"Colares",
    nome:"Corrente quadrada de prata",
    preco:199,
    descricao:"Corrente de prata quadrada, 0,9 mm, 45 cm.",
    imagem:"fotos/94781.jpg"
  },
  {
    codigo:"SL2026-005",
    categoria:"Colares",
    nome:"Colar pingente redondo",
    preco:182.50,
    descricao:"Colar de prata com pingente redondo cravejado com pedras claras.",
    imagem:"fotos/sl2026-005.jpg"
  }
];

const dinheiro = valor =>
  Number(valor).toLocaleString("pt-BR",{
    style:"currency",
    currency:"BRL"
  });

function abrirCatalogo(){
  document.getElementById("capa").hidden=true;
  document.getElementById("loja").hidden=false;
  location.hash="catalogo";
  window.scrollTo(0,0);
}

function voltarCapa(){
  document.getElementById("loja").hidden=true;
  document.getElementById("capa").hidden=false;
  location.hash="capa";
  window.scrollTo(0,0);
}

function linkWhatsApp(texto){
  return "https://wa.me/"+WHATSAPP+
    "?text="+encodeURIComponent(texto);
}

function criarProduto(p){
  const card=document.createElement("article");
  card.className="produto";

  const imagem=document.createElement("img");
  imagem.src=p.imagem;
  imagem.alt=p.nome;
  imagem.loading="lazy";

  const info=document.createElement("div");
  info.className="info";

  const nome=document.createElement("h3");
  nome.textContent=p.nome;

  const codigo=document.createElement("p");
  codigo.className="codigo";
  codigo.textContent="Cód. "+p.codigo;

  const descricao=document.createElement("p");
  descricao.textContent=p.descricao;

  const preco=document.createElement("p");
  preco.className="preco";
  preco.textContent=dinheiro(p.preco);

  const botao=document.createElement("a");
  botao.className="btn";
  botao.target="_blank";
  botao.rel="noopener";
  botao.textContent="Consultar pelo WhatsApp";
  botao.href=linkWhatsApp(
    "Olá! Tenho interesse na joia "+
    p.nome+" (cód. "+p.codigo+
    "), no valor de "+dinheiro(p.preco)+
    ". Está disponível?"
  );

  info.append(nome,codigo,descricao,preco,botao);
  card.append(imagem,info);
  return card;
}

function mostrarProdutos(categoria="Todas"){
  const grade=document.getElementById("produtos");
  grade.replaceChildren();

  const selecionados=produtos.filter(p=>
    categoria==="Todas" || p.categoria===categoria
  );

  selecionados.forEach(p=>
    grade.appendChild(criarProduto(p))
  );

  document.querySelectorAll(".filtros button")
    .forEach(botao=>{
      botao.classList.toggle(
        "ativo",
        botao.textContent===categoria
      );
    });
}

function criarFiltros(){
  const area=document.getElementById("filtros");
  const categorias=[
    "Todas",
    ...new Set(produtos.map(p=>p.categoria))
  ];

  categorias.forEach(categoria=>{
    const botao=document.createElement("button");
    botao.textContent=categoria;
    botao.onclick=()=>mostrarProdutos(categoria);
    area.appendChild(botao);
  });
}

document.getElementById("whatsappGeral").href=
  linkWhatsApp(
    "Olá! Gostaria de conhecer as joias da Silver Love."
  );

criarFiltros();
mostrarProdutos();

if(location.hash==="#catalogo"){
  abrirCatalogo();
}
</script>
</body>
</html>
